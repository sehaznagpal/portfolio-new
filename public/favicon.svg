<!-- Brand favicon (Figma 1406:2342). Favicons can't read CSS variables, so the
     brand colour (--color-brand in src/styles/tokens.css) is written out here;
     keep the edge stop in sync with that token. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250">
  <defs>
    <radialGradient id="brand" cx="125" cy="125" r="125" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E3DCCC"/>
      <stop offset="0.5" stop-color="#DED59B"/>
      <stop offset="1" stop-color="#D9CE6A"/>
    </radialGradient>
  </defs>
  <circle cx="125" cy="125" r="125" fill="url(#brand)"/>
</svg>
