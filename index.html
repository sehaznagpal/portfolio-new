<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v= busts browsers' long-lived favicon cache; bump it whenever the icons change. -->
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico?v=3" sizes="16x16 32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <!-- Brand colour (--color-brand in src/styles/tokens.css); meta tags can't read CSS variables. -->
    <meta name="theme-color" content="#D9CE6A" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sehaz Nagpal | Product Designer Portfolio</title>
    <!-- Hero name hover-swap alternates (see HeroName.tsx) — preloaded so
         the first hover never has to wait on a network fetch. -->
    <link rel="preload" href="/fonts/PixelifySans-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Boska-LightItalic.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
